proxy_cache_path /var/cache/nginx/ghproxy levels=1:2 keys_zone=proxy_cache:10m inactive=60m use_temp_path=off;
proxy_buffer_size 16k;
proxy_busy_buffers_size 64k;
proxy_buffers 4 32k;
proxy_ssl_server_name on;
server_tokens off;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name github.yourdomain.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name github.yourdomain.com;
	http2 on;
	ssl_certificate replace/me.pem;
	ssl_certificate_key replace/me.key;

	location = /__ghproxy.js {
		alias replace/inject.js;
		default_type application/javascript;
		add_header Cache-Control "public, max-age=3600";
	}

	location = / {
		default_type text/html;
		return 200 '<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>GitHub Proxy</title></html>';
	}

	location ~* ^/(login|signin|signup|join|register|session|sessions|oauth|sso|authorize|authenticate|copilot([-_][a-z0-9]+)?|features/copilot([-_][a-z0-9]+)?|pricing|plans?|account|settings|checkout|billing|enterprise)(/|$) {
		return 404;
	}

	location / {
		proxy_pass https://github.com/;
		proxy_cache proxy_cache;
		proxy_cache_key $uri$is_args$args;
		proxy_cache_valid 200 302 2m;
		proxy_cache_valid 404 1m;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_buffering on;
		proxy_set_header Accept-Encoding "";
		add_header content-security-policy "default-src 'none'; base-uri 'self'; child-src github.yourdomain.com assets.github.yourdomain.com; connect-src github.yourdomain.com raw.github.yourdomain.com github-cloud.s3.amazonaws.com gist.github.yourdomain.com assets.github.yourdomain.com objects.github.yourdomain.com api.github.yourdomain.com; img-src github.yourdomain.com avatars.github.yourdomain.com assets.github.yourdomain.com; script-src 'self' assets.github.yourdomain.com; style-src 'unsafe-inline' assets.github.yourdomain.com; upgrade-insecure-requests" always;
		header_filter_by_lua_block {
			ngx.header.content_security_policy = nil;
			ngx.header.content_security_policy_report_only = nil;

			local ct = ngx.header.content_type;
			if type(ct) == "table" then ct = ct[1] end
			ct = (ct or ""):lower();
			if ct:find("text/html", 1, true) or ct:find("text/css", 1, true)
			    or ct:find("javascript", 1, true) or ct:find("json", 1, true) then
				ngx.header.content_length = nil;
			end

			local status = ngx.status;
			if status >= 300 and status < 400 then
				local loc = ngx.header.location;
				if type(loc) == "table" then loc = loc[1]; ngx.header.location = loc end
				if loc then
					local host = nil;
					if loc:sub(1, 1) == "/" then
						if loc:sub(1, 2) == "//" then
							host = loc:match("^//([^/:?#]+)");
						end
					else
						host = loc:match("^https?://([^/:?#]+)");
					end
					if host and not host:lower():find("github", 1, true) then
						ngx.header.location = nil;
						ngx.status = 403;
					end
				end
			end
		}
		body_filter_by_lua_block {
			local headers = ngx.resp.get_headers();
			local ct = headers["content-type"];
			if type(ct) == "table" then ct = ct[1] end
			ct = (ct or ""):lower();

			local is_html = ct:find("text/html", 1, true) == 1;
			local is_css  = ct:find("text/css", 1, true) == 1;
			local is_js   = (ct:find("javascript", 1, true) or ct:find("json", 1, true)) and true or false;
			if not (is_html or is_css or is_js) then return end

			local chunk = ngx.arg[1];
			local eof = ngx.arg[2];
			local buf;
			if chunk and #chunk > 0 then
				buf = (ngx.ctx.tail or "") .. chunk;
				ngx.ctx.tail = "";
			elseif eof then
				buf = ngx.ctx.tail or "";
				ngx.ctx.tail = nil;
			else
				return;
			end

			local hold = nil;  

			if not eof then
				if is_html and not ngx.ctx.injected and #buf <= 8192 then
					local lt = buf:match(".*()<");
					if lt then hold = lt end
				end

				local last = nil;
				local p = 1;
				while true do
					local i = buf:find("://", p, true);
					if not i then break end
					last = i;
					p = i + 1;
				end
				if last then
					local rest = buf:sub(last + 3);
					if not rest:find("[\"'%s<>),;]") then
						local head = buf:sub(1, last - 1);
						local s = head:match(".*http");
						if s then
							local st = #head - #s + 1;
							if #buf - st + 1 <= 8192 and (not hold or st < hold) then
								hold = st;
							end
						end
					end
				end

				if hold then
					ngx.ctx.tail = buf:sub(hold);
					buf = buf:sub(1, hold - 1);
				end
			end

			if #buf > 0 then
				if is_html then
					if not ngx.ctx.injected then
						local s, e = buf:find("<body[^>]*>");
						if s then
							buf = buf:sub(1, e) .. '<script src="/__ghproxy.js"></script>' .. buf:sub(e + 1);
							ngx.ctx.injected = true;
						end
					end
					if not ngx.ctx.injected and eof then
						local p = buf:find("</html>");
						if p then
							buf = buf:sub(1, p - 1) .. '<script src="/__ghproxy.js"></script>' .. buf:sub(p);
							ngx.ctx.injected = true;
						end
					end
				end

				local suf = "(?=[\\s/?#\"'<>()[\\],;]|$)";
				if is_html or is_css or is_js then
					buf = (ngx.re.gsub(buf, "https://github\\.githubassets\\.com" .. suf, "https://assets.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://api\\.github\\.com" .. suf, "https://api.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://gist\\.github\\.com" .. suf, "https://gist.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://github\\.com" .. suf, "https://github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://raw\\.githubusercontent\\.com" .. suf, "https://raw.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://avatars\\.githubusercontent\\.com" .. suf, "https://avatars.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://objects\\.githubusercontent\\.com" .. suf, "https://objects.github.yourdomain.com", "jo"));
					buf = (ngx.re.gsub(buf, "https://user-images\\.githubusercontent\\.com" .. suf, "https://user-images.github.yourdomain.com", "jo"));
				end
				ngx.arg[1] = buf;
			else
				ngx.arg[1] = "";
			end
		}
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name assets.github.yourdomain.com;
	http2 on;
	ssl_certificate replace/me.pem;
	ssl_certificate_key replace/me.key;
	location / {
		proxy_pass https://github.githubassets.com/;
		proxy_cache proxy_cache;
		proxy_cache_key $uri$is_args$args;
		proxy_cache_valid 200 302 10m;
		proxy_cache_valid 404 1m;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_buffering on;
	}
}
