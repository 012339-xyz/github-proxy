proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=proxy_cache:10m inactive=60m use_temp_path=off;
proxy_buffer_size 16k;
proxy_busy_buffers_size 64k;
proxy_buffers 4 32k;
server_tokens off;
server {
	listen [::]:443 ssl;
	server_name github.yourdomain.com;
	http2 on;
	ssl_certificate replace/me.pem;
	ssl_certificate_key replace/me.key;
	location = / {
		return 200;
	}
	location /login {
		return 404;
	}
	location /signup {
		return 404;
	}
	location /oauth {
		return 404;
	}
	location /sso {
		return 404;
	}
	location /sessions {
		return 404;
	}
	location /authorize {
		return 404;
	}
	location /authenticate {
		return 404;
	}
	location /join {
		return 404;
	}
	location /copilot {
		return 404;
	}
	location /enterprise {
		return 404;
	}
	location /pricing {
		return 404;
	}
	location /plan {
		return 404;
	}
	location /account {
		return 404;
	}
	location /settings {
		return 404;
	}
	location / {
		proxy_pass https://github.com/;
		proxy_cache proxy_cache;
		proxy_cache_key $uri$is_args$args;
		proxy_cache_valid 200 302 2m;
		proxy_cache_valid 404 1m;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_buffering on;
		proxy_set_header Accept-Encoding "";
		add_header content-security-policy "default-src 'none'; base-uri 'self'; child-src github.yourdomain.com assets.github.yourdomain.com; connect-src github.yourdomain.com raw.github.yourdomain.com github-cloud.s3.amazonaws.com gist.github.yourdomain.com assets.github.yourdomain.com objects.github.yourdomain.com; img-src github.yourdomain.com avatars.github.yourdomain.com assets.github.yourdomain.com; script-src assets.github.yourdomain.com; style-src 'unsafe-inline' assets.github.yourdomain.com; upgrade-insecure-requests";
		header_filter_by_lua_block {
			ngx.header.content_security_policy = nil;
		}
		body_filter_by_lua_block {
			local headers = ngx.resp.get_headers();
			local content_type = headers["content-type"];
			local chunk = ngx.arg[1];
			local eof = ngx.arg[2];
			if ( content_type == "text/html" or content_type == "text/html; charset=utf-8" ) and chunk and #chunk > 0 then
			chunk = ngx.re.gsub(chunk, "<body>", "<body><script></script>", "jo");
			chunk = ngx.re.gsub(chunk, "https://github\\.com", "https://github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://gist.github\\.com", "https://gist.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://raw\\.githubusercontent\\.com", "https://raw.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://github\\.githubassets\\.com", "https://assets.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://avatars\\.githubusercontent\\.com", "https://avatars.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://objects\\.githubusercontent\\.com", "https://objects.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://user-images\\.githubusercontent\\.com", "https://user-images.github.yourdomain.com", "jo");
			ngx.arg[1] = chunk;
			end
			if ( content_type == "text/css" or content_type == "text/css; charset=utf-8" or content_type == "application/javascript" or content_type == "application/javascript; charset=utf-8" ) and chunk and #chunk > 0 then
			chunk = ngx.re.gsub(chunk, "https://github\\.com", "/https://github.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://gist.github\\.com", "https://gist.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://raw\\.githubusercontent\\.com", "https://raw.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://github\\.githubassets\\.com", "https://assets.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://avatars\\.githubusercontent\\.com", "https://avatars.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://avatars\\.githubusercontent\\.com", "https://avatars.github.yourdomain.com", "jo");
			chunk = ngx.re.gsub(chunk, "https://user-images\\.githubusercontent\\.com", "https://user-images.github.yourdomain.com", "jo");
			ngx.arg[1] = chunk;
			end
		}
	}
}
server {
	listen [::]:443 ssl;
	server_name assets.github.yourdomain.com;
	http2 on;
	ssl_certificate replace/me.pem;
	ssl_certificate_key replace/me.key;
	location / {
		proxy_pass https://github.githubassets.com/;
		proxy_cache proxy_cache;
		proxy_cache_key $uri$is_args$args;
		proxy_cache_valid 200 302 10m;
		proxy_cache_valid 404 1m;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_buffering on;
	}
}
